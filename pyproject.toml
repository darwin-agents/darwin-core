[project]
name = "darwin-core"
version = "0.1.0"
description = "darwin's core infra for biological agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "playwright>=1.54.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
darwin-core = "darwin_core.main:main"
darwin-browser-use-server = "darwin_core.servers.browser_use.app:main"
darwin-openrouter-web-agent = "darwin_core.agents.web.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/darwin_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
